# Either copy this file and replace every placeholder manually, or let
# tools/generate_esphome_secrets.py create secrets.yaml. Never commit the real file.
esphome_api_encryption_key: "BASE64_32_BYTE_KEY"
esphome_ota_password: "A_LONG_UNIQUE_PASSWORD"
