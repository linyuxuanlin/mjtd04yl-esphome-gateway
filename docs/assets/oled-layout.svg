  <rect width="768" height="384" rx="30" fill="#11151b"/>
  <rect x="24" y="24" width="720" height="336" rx="18" fill="#050708" stroke="#39414b" stroke-width="4"/>
  <g fill="#f4f7f8" stroke="#f4f7f8" font-family="DejaVu Sans Mono, monospace">
    <g stroke="none" font-size="38" font-weight="700">
      <text x="48" y="78">11:42</text>
      <text x="252" y="78">HA</text>
      <text x="366" y="78">L</text>
      <text x="712" y="78" text-anchor="end">W -36</text>
    </g>
    <circle cx="342" cy="62" r="12"/>
    <circle cx="414" cy="62" r="12"/>
    <path d="M48 96H720" stroke-width="4"/>

    <g stroke="none" font-weight="700">
      <text x="48" y="171" font-size="40">IN</text>
      <text x="420" y="171" font-size="70" text-anchor="end">31.0°</text>
      <text x="650" y="171" font-size="70" text-anchor="end">81%</text>
      <text x="48" y="278" font-size="40">OUT</text>
      <text x="420" y="278" font-size="70" text-anchor="end">27.2°</text>
      <text x="650" y="278" font-size="70" text-anchor="end">73%</text>
      <text x="48" y="344" font-size="38">PM2.5</text>
      <text x="336" y="344" font-size="48" text-anchor="end">2</text>
      <text x="426" y="344" font-size="38">VOC</text>
      <text x="690" y="344" font-size="48" text-anchor="end">155</text>
    </g>

    <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M458 166V130M458 130l-14 14M458 130l14 14"/>
      <path d="M688 166V130M688 130l-14 14M688 130l14 14"/>
