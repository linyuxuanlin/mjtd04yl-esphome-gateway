<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 384" role="img" aria-labelledby="title desc">
  <title id="title">ESPHome OLED 气候面板布局示意</title>
  <desc id="desc">128x64 单色 OLED 的等比例界面：上方显示 Home Assistant 连接状态，中间显示室外温湿度，下方显示室内温湿度。</desc>
  <rect width="768" height="384" rx="30" fill="#11151b"/>
  <rect x="24" y="24" width="720" height="336" rx="18" fill="#050708" stroke="#39414b" stroke-width="4"/>
  <g fill="#f4f7f8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="76" font-size="34" font-weight="700" letter-spacing="2">HOME CLIMATE</text>
    <text x="712" y="76" font-size="34" font-weight="700" text-anchor="end">HA OK</text>
    <path d="M48 98H720" stroke="#f4f7f8" stroke-width="4"/>

    <text x="56" y="169" font-size="34" font-weight="700">OUT</text>
    <text x="220" y="172" font-size="66" font-weight="700">31.0°</text>
    <text x="712" y="172" font-size="66" font-weight="700" text-anchor="end">81%</text>
    <path d="M48 215H720" stroke="#f4f7f8" stroke-width="4"/>

    <text x="56" y="302" font-size="34" font-weight="700">IN</text>
    <text x="220" y="305" font-size="66" font-weight="700">30.4°</text>
    <text x="712" y="305" font-size="66" font-weight="700" text-anchor="end">76%</text>
  </g>
</svg>
