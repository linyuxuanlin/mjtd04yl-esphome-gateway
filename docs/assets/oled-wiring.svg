<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Beetle ESP32-C3 与 SSD1306 OLED 接线图</title>
  <desc id="desc">当前 ESPHome 配置使用 GPIO0 连接 SCL，GPIO1 连接 SDA，并连接 3V3 与 GND。</desc>
  <rect width="960" height="430" rx="28" fill="#f6f8fa"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="70" y="48" width="320" height="334" rx="26" fill="#15191d"/>
    <text x="230" y="96" fill="#fff" font-size="28" font-weight="700" text-anchor="middle">Beetle ESP32-C3</text>
    <rect x="128" y="118" width="204" height="104" rx="14" fill="#c7cbd0"/>
    <text x="230" y="180" fill="#30343a" font-size="22" font-weight="700" text-anchor="middle">ESP32-C3</text>

    <g fill="#f2c94c" stroke="#8a6c00" stroke-width="2">
      <circle cx="370" cy="260" r="9"/><circle cx="370" cy="292" r="9"/>
      <circle cx="370" cy="324" r="9"/><circle cx="370" cy="356" r="9"/>
    </g>
    <g fill="#fff" font-size="19" text-anchor="end">
      <text x="346" y="266">3V3</text><text x="346" y="298">GND</text>
      <text x="346" y="330">GPIO0</text><text x="346" y="362">GPIO1</text>
    </g>

    <rect x="650" y="48" width="240" height="334" rx="20" fill="#234b72"/>
    <rect x="682" y="78" width="176" height="112" rx="8" fill="#07131f" stroke="#89b9df" stroke-width="3"/>
    <text x="770" y="126" fill="#fff" font-family="ui-monospace, monospace" font-size="18" text-anchor="middle">HOME CLIMATE</text>
    <text x="770" y="154" fill="#fff" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">OUT  ·  IN</text>
    <text x="770" y="226" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">SSD1306 OLED</text>

    <g fill="#f2c94c" stroke="#8a6c00" stroke-width="2">
      <circle cx="650" cy="260" r="9"/><circle cx="650" cy="292" r="9"/>
      <circle cx="650" cy="324" r="9"/><circle cx="650" cy="356" r="9"/>
    </g>
    <g fill="#fff" font-size="19">
      <text x="674" y="266">VCC</text><text x="674" y="298">GND</text>
      <text x="674" y="330">SCL</text><text x="674" y="362">SDA</text>
    </g>

    <path d="M379 260H641" fill="none" stroke="#d93f0b" stroke-width="6"/>
    <path d="M379 292H641" fill="none" stroke="#333" stroke-width="6"/>
    <path d="M379 324H641" fill="none" stroke="#2774c9" stroke-width="6"/>
    <path d="M379 356H641" fill="none" stroke="#2da44e" stroke-width="6"/>
  </g>
</svg>
